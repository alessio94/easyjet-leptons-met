# Toggles for object types
do_small_R_jets: true
do_large_R_Topo_jets: true
do_large_R_UFO_jets: false
do_VR_jets: true
do_muons: true
do_electrons: false
do_photons: false
# btagging working points for small Rjets
btag_wps:
    - DL1dv01_FixedCutBEff_70
    - DL1dv01_FixedCutBEff_77
    - DL1dv01_FixedCutBEff_85
    - GN120220509_FixedCutBEff_70
    - GN120220509_FixedCutBEff_77
    - GN120220509_FixedCutBEff_85
# btagging working points for Variable Radius Track jets
vr_btag_wps:
    - DL1r_FixedCutBEff_77
    - DL1r_FixedCutBEff_85

# list of triggers to apply
# "Auto" configures mc from the r-tag, data from year, e.g. data22
trigger_year: Auto
# "Auto" configures triggers for "HH4bResolved", "HH4bBoosted"
# We can also be explicit here I think
trigger_list: ["HH4bResolved", "HH4bBoosted"]
# apply trigger lists to filter events
do_trigger_filtering: true
# disable CP Algs for calibration
disable_calib: false
# apply loose jet cleaning only
loose_jet_cleaning: true
# if you want to run a baseline diHiggs analyses
do_resolved_dihiggs_analysis: false
do_boosted_dihiggs_analysis: false
do_yybb_analysis: false
do_bbtt_analysis: false
# if you want to truth match (is MC protected)
# Whether to activate CP alg systematic variations
do_CP_systematics: true
systematics_regex: [
    "JET_JER",
    "JET_JMR",
    "JET_JD2R",
    "JET_Comb_Modelling",
    "JET_Comb_Baseline",
    "JET_Comb_Tracking",
    "JET_Comb_TotalStat",
    "JET_MassRes_Hbb",
    "JET_MassRes_Top",
    "JET_MassRes_WZ",
    "JET_Rtrk_Modelling",
    "JET_Rtrk_Baseline",
    "JET_Rtrk_Tracking",
    "JET_Rtrk_TotalStat",
]
# write objects with overlap removal applied
# turning this on you have to decide on one large R jet collection
do_overlap_removal: false
# which objects to write
write_small_R_jets: true
write_large_R_Topo_jets: true
write_large_R_UFO_jets: false
write_VR_jets: true
write_muons: false
write_electrons: false
write_photons: false
# additional small R info
write_small_R_higgs_parent_info: false
write_small_R_btag: false
write_small_R_JVT_details: false
write_small_R_no_bjet_calib: false
write_small_R_gn2_branches: false
# additional Large R info
write_large_R_substructure: false
write_large_R_truth_labels: true
# turned off automatically if MC
write_truth_small_R_jets: false
write_truth_large_R_jets: false
write_truth_higgs: false
# custom extra output branches
extra_output_branches: []
