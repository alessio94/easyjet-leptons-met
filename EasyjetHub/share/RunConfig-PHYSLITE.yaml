include: base-config.yaml
# Replace container names with PHYSLITE ones
container_names:
    include: container-names-DAOD_PHYSLITE.yaml

# Toggles for object types
do_small_R_jets: true
do_large_R_UFO_jets: true
do_muons: true

# btagging working points for small Rjets
btag_wps:
    - DL1dv01_FixedCutBEff_70
    - DL1dv01_FixedCutBEff_77
    - DL1dv01_FixedCutBEff_85
    - GN120220509_FixedCutBEff_70
    - GN120220509_FixedCutBEff_77
    - GN120220509_FixedCutBEff_85

# btagging working points for Variable Radius Track jets
vr_btag_wps:
    - DL1r_FixedCutBEff_77
    - DL1r_FixedCutBEff_85

# "Auto" configures triggers for "bbbbResolved", "bbbbBoosted"
# We can also be explicit here I think
trigger_list: ["bbbbResolved", "bbbbBoosted"]

# apply trigger lists to filter events
do_trigger_filtering: true

# disable CP Algs for calibration
disable_calib: true

# apply loose jet cleaning only
loose_jet_cleaning: true

# Include the TTree configuration and update details
ttree_output:
  ttree_names:
    - AnalysisMiniTree
  AnalysisMiniTree:
    include: AnalysisMiniTree-config.yaml
    # Our overrides. All defaults are off
    reco_outputs:
      small_R_jets: true
      large_R_UFO_jets: true
      muons: true
    collection_options:
      small_R_jets:
        higgs_parent_info: true
        gn2_branches: true
      large_R_jets:
        substructure_info: true
    truth_outputs:
      small_R_jets: true
      large_R_jets: true
      higgs_particle: true
