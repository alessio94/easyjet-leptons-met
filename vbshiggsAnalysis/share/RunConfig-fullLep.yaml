include: vbshiggsAnalysis/RunConfig-common.yaml 

# Which analysis to consider
channels: ["FullLep"]

do_resolved: true
# Use VBFRNN tagger
UseVBFRNN : true

# VgammaORTool Setup
do_VgammaOR: true
bypass_VGammaOR: true 
VGammaOR_ypT_cuts: [17.e+3] #photon pT in MeV
VGammaOR_dR_lepton_photon_cuts: [0.3]

Electron:
  maxD0Significance: 10
  maxDeltaZ0SinTheta: 0.5
  ID: "LooseBLayerLH"
  Iso: "NonIso"
  amount: 0
  correlationModelId: "TOTAL"
  extra_wps:
    - ["LooseBLayerLH", "Loose_VarRad"]
    - ["LooseBLayerLH", "Tight_VarRad"]
    - ["LooseBLayerLH", "TightTrackOnly_VarRad"]
    - ["LooseBLayerLH", "TightTrackOnly_FixedRad"]

    - ["MediumLH", "Loose_VarRad"]
    - ["MediumLH", "Tight_VarRad"]
    - ["MediumLH", "TightTrackOnly_VarRad"]
    - ["MediumLH", "TightTrackOnly_FixedRad"]
    - ["MediumLH", "NonIso"]

    - ["TightLH", "Loose_VarRad"]
    - ["TightLH", "Tight_VarRad"]
    - ["TightLH", "TightTrackOnly_VarRad"]
    - ["TightLH", "TightTrackOnly_FixedRad"]
    - ["TightLH", "NonIso"]

    - ["LooseDNNElectron", "Loose_VarRad"]
    - ["LooseDNNElectron", "Tight_VarRad"]
    - ["LooseDNNElectron", "TightTrackOnly_VarRad"]
    - ["LooseDNNElectron", "TightTrackOnly_FixedRad"]

    - ["MediumDNNElectron", "Loose_VarRad"]
    - ["MediumDNNElectron", "Tight_VarRad"]
    - ["MediumDNNElectron", "TightTrackOnly_VarRad"]
    - ["MediumDNNElectron", "TightTrackOnly_FixedRad"]

    - ["TightDNNElectron", "Loose_VarRad"]
    - ["TightDNNElectron", "Tight_VarRad"]
    - ["TightDNNElectron", "TightTrackOnly_VarRad"]
    - ["TightDNNElectron", "TightTrackOnly_FixedRad"]
  do_IFF_decoration: true
  do_reco_decoration: true
Muon:
  maxD0Significance: 10
  maxDeltaZ0SinTheta: 0.5
  ID: "Loose"
  Iso: "NonIso"
  amount: 0
  extra_wps:
    - ["Loose", "PflowLoose_VarRad"]
    - ["Loose", "PflowTight_VarRad"]
    
    - ["Medium", "PflowLoose_VarRad"]
    - ["Medium", "PflowTight_VarRad"]
    - ["Medium", "NonIso"]

    - ["Tight", "PflowLoose_VarRad"]
    - ["Tight", "PflowTight_VarRad"]
    - ["Tight", "NonIso"]

    - ["HighPt", "PflowLoose_VarRad"]
    - ["HighPt", "PflowTight_VarRad"]
    - ["HighPt", "NonIso"]
  do_IFF_decoration: true

Lepton:
  amount: 2
  variables_int: ["isPrompt","truthOrigin", "truthType", "ele_ECIDS", 
                  "ele_firstEgMotherTruthType", "ele_firstEgMotherTruthOrigin", "ele_firstEgMotherPdgId"]

# Toggles for reconstructed objects decorations
Small_R_jet:
  # btagging working points 
  btag_wp: "GN2v01_FixedCutBEff_90"
  amount: 0
  # to use multiple btagging WPs
  btag_extra_wps:
    - GN2v01_Continuous

Large_R_jet:
  min_pT: 200.e+3
  maxEta: 2.0
  runMuonJetPtCorr: false
  amount_leadingjet: 1
  GN2X_hbb_wps:
    - "FlatMassQCDEff_0p25"
    - "FlatMassQCDEff_0p3"
    - "FlatMassQCDEff_0p37"
    - "FlatMassQCDEff_0p46"
    - "FlatMassQCDEff_0p58"
    - "FlatMassQCDEff_0p74"
    - "FlatMassQCDEff_0p94"
    - "FlatMassQCDEff_1p25"
    - "FlatMassQCDEff_1p55"
    
# list of triggers per year to consider
Trigger:
  include: vbshiggsAnalysis/trigger-lep.yaml
  writeOutput: False

CutList :
      - PASS_EXACTLY_TWO_LEPTONS
      - PASS_TRIGGER 
      - PASS_TWO_SS_CHARGE_LEPTONS
      - PASS_TWO_OS_CHARGE_LEPTONS
      - PASS_ONE_LARGE_JET
      - PASS_TWO_SIGNAL_JETS
