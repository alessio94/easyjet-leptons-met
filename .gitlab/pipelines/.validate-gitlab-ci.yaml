variables:
  # needed to propagate the exit code from the script to the CI
  FF_USE_NEW_BASH_EVAL_STRATEGY: true

.ntuple_validation:
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'
  stage: validate
  tags:
    - k8s-eos
  artifacts:
    paths:
      - branch-diff-log.txt
    expire_in: 1 week
  allow_failure:
    exit_codes: # in order of severity
      - 22 # branch diff
      - 23 # branch removed
      - 24 # branch added

# Data

validator_fast_data18:
  extends: .ntuple_validation
  needs:
    - job: compile
      artifacts: true
    - job: ntupler_fast_data18
      artifacts: false
  script:
    - easyjet-validate fast-data18

