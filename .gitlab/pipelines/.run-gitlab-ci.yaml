variables:
  # overrides the log level in easyjet-test
  EASYJET_LOG_LEVEL: INFO
  # default test directory for easyjet-test, can be overridden by -d
  EASYJET_TESTDIR: ci_testdir

.to_central: &to_central
  if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'

.core_pkgs: &core_pkgs
  <<: *to_central
  changes:
    - EasyjetHub/**
    - EasyjetPlus/**
    - EasyjetTests/**

.ntupler:
  rules:
    - <<: *to_central
  variables:
    GIT_STRATEGY: none
  stage: run
  needs: [compile]
  tags:
    - k8s-eos
    - cvmfs
  artifacts:
    paths:
      - $EASYJET_TESTDIR/output-branches-analysis.txt
      - $EASYJET_TESTDIR/userJobMetadata.json
    expire_in: 1 week
  
.ntupler_bbbb:
  extends: .ntupler
  rules:
    - <<: *to_central
      changes: [bbbbAnalysis/**]
    - <<: *core_pkgs
    - when: never

.ntupler_bbbbtt:
  extends: .ntupler
  rules:
