variables:
  # overrides the log level in easyjet-test
  EASYJET_LOG_LEVEL: INFO
  # default test directory for easyjet-test, can be overridden by -d
  EASYJET_TESTDIR: ci_testdir

.ntupler:
  stage: run
  needs: [compile]
  artifacts:
    paths:
      - $EASYJET_TESTDIR/output-branches-analysis.txt
      - $EASYJET_TESTDIR/userJobMetadata.json
    expire_in: 1 week      

# Data

ntupler_fast_data18:
  extends: .ntupler
  script:
    - easyjet-test fast-data18

ntupler_fast_data22:
  extends: .ntupler
  script:
    - easyjet-test fast-data22

