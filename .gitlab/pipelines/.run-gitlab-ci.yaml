# test without eos or cvmfs run, intentionally doesn't include cvmfs
# and pretends not to have EOS credentials

test_eos_free:
 stage: run
 needs: [compile]
 script:
   - EASYJET_FAKE_MISSING_EOS=1 easyjet-test zbbycalib-mc23

# metatests

test_fail:
  tags:
    - cvmfs
  stage: run
  needs: [compile]
  script:
    - (! easyjet-test fail)

test_all:
  tags:
    - cvmfs
  stage: run
  needs: [compile]
  script:
    - EASYJET_METATEST=true easyjet-test all
