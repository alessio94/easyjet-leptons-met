variables:
  FORCED_LOG_LEVEL: INFO
  TESTDIR: ci_testdir

.run_easyjet-ntupler:
  stage: run
  needs: [compile]
  artifacts:
    paths:
      - $TESTDIR/output-branches-analysis-variables.txt
      - $TESTDIR/userJobMetadata.json

run_easyjet-ntupler_fast_data18_DAOD_PHYS:
  extends: .run_easyjet-ntupler
  script:
    - easyjet-test -d $TESTDIR data18-fast

