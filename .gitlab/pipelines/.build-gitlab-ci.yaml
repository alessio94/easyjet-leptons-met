variables:
  GIT_SUBMODULE_STRATEGY: recursive

cmake:
  stage: build
  script:
    - mkdir -p build # -p checks if it already exists
    - cd build
    - cmake .. | tee cmake.log
  artifacts:
    paths:
      - build
    expire_in: 1 week
  needs: []

compile:
  stage: build
  script:
    - cd build
    - make clean # make sure we don't have residual compilation results
    - make -j $(nproc) 2>&1 | tee -a cmake.log # dump the log files
  artifacts:
    paths:
      - build
    expire_in: 1 week
  needs: [cmake]

clang_tidy:
  stage: build
  tags:
    - cvmfs
  before_script:
    - source $(find /cvmfs/atlas.cern.ch/repo/ATLASLocalRootBase/x86_64/Clang/current/ -mindepth 3 -maxdepth 3 -type f -name setup.sh)
    - cd build
  script: # exclude auto-generated files from clang check (only way I found to do it).
    - mv compile_commands.json compile_commands_back.json
    - jq -M 'map(select(.file | test("build/") | not))' compile_commands_back.json > compile_commands.json
    - run-clang-tidy -j8 -use-color -config-file ../.clang-tidy -warnings-as-errors '*'
  needs: [cmake]
