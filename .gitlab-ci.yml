# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_PROJECT_PATH == 'easyjet/easyjet'
    # - if: $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == 'main' && $CI_PROJECT_PATH == 'easyjet/easyjet'
    - if: '$CI_PIPELINE_SOURCE =~ /(schedule|web)/'

# get an ath analysis image
image: gitlab-registry.cern.ch/atlas/athena/athanalysis:25.2.76

stages:
  - linting
  - build
  - unittest
  - run
  - validate
  - post

# and source it
before_script:
  # limit lfs use to avoid abusing cern resources
  # See https://gitlab.cern.ch/easyjet/easyjet/-/issues/463
  - git config --global lfs.concurrenttransfers 3 # Default is 8.
  - git config --global lfs.transfer.maxretries 3 # Default is 8.
  # other easyjet stuff
  - set -e # exits the pipeline if one of the jobs don't return 0
  - source ~/release_setup.sh
  - if [[ -d build ]]; then source build/**/setup.sh; fi
  - env

include:
  - ".gitlab/pipelines/.linting-gitlab-ci.yaml"
  - ".gitlab/pipelines/.build-gitlab-ci.yaml"
  - ".gitlab/pipelines/.unittest-gitlab-ci.yaml"
  - ".gitlab/pipelines/.run-gitlab-ci.yaml"
  - ".gitlab/pipelines/.validate-gitlab-ci.yaml"
  - ".gitlab/pipelines/.post-gitlab-ci.yaml"
