#TODO

include: EasyjetHub/base-config.yaml

# Which analysis to consider
do_hhml_analysis: true

# CutBookKeeper histPattern
cbkHistPattern: "CutBookkeeper_%RUN%_%SYS%"

bypass: false

# Decay mode considered for truth decoration
truthDecayModes: ["bbZZ", "WWWW", "WWZZ","WWtt", "ZZtt", "tttt"]

# Toggles for object types
do_small_R_jets: true
do_muons: true
do_electrons: true
do_taus: true
do_met : true


# Toggles for reconstructed objects decorations
small_R_jet:
  useFJvt: true
  # btagging nominal working point
  btag_wp: "GN2v01_FixedCutBEff_85"
  btag_extra_wps:
    - GN2v01_Continuous
    - DL1dv01_Continuous
  variables_bjets: ["uncorrPt", "muonCorrPt"]
  variables_int_bjets: ["truthLabel", "pcbt_GN2v01", "pcbt_DL1dv01", "nmuons"]
  amount_bjet: 2
  amount: 2

Tau:
  ID: "RNNLoose"
  amount: 2
  variables: ["RNN"]
  variables_int: ["isTauID", "truthType", "EleRNN_WP", "tauTruthJetLabel"]
  do_parent_decoration: true

Electron:
  ID: "LooseBLayer"
  Iso: "NonIso"
  extra_wps: 
    - ["Tight", "Tight_VarRad"]
    - ["Tight", "TightTrackOnly_VarRad"]
    - ["Tight", "TightTrackOnly_FixedRad"]
    - ["Tight", "Loose_VarRad"]
    - ["Tight", "HighPtCaloOnly"]
    - ["Medium", "Tight_VarRad"]
    - ["Medium", "TightTrackOnly_VarRad"]
    - ["Medium", "TightTrackOnly_FixedRad"]
    - ["Medium", "Loose_VarRad"]
    - ["Medium", "HighPtCaloOnly"]
    - ["LooseBLayer", "Tight_VarRad"]
    - ["LooseBLayer", "TightTrackOnly_VarRad"]
    - ["LooseBLayer", "TightTrackOnly_FixedRad"]
    - ["LooseBLayer", "HighPtCaloOnly"]
  do_parent_decoration: true
  # chargeIDSelectionRun2: true

Muon:
  ID: "Loose"
  Iso: "NonIso"
  extra_wps:
    - ["Tight", "PflowLoose_VarRad"]
    - ["Tight", "PflowTight_VarRad"]
    - ["Tight", "Loose_VarRad"]
    - ["Tight", "Tight_VarRad"]
    - ["Medium", "PflowLoose_VarRad"]
    - ["Medium", "PflowTight_VarRad"]
    - ["Medium", "Loose_VarRad"]
    - ["Medium", "Tight_VarRad"]
    - ["HighPt", "PflowLoose_VarRad"]
    - ["HighPt", "PflowTight_VarRad"]
    - ["HighPt", "Loose_VarRad"]
    - ["HighPt", "Tight_VarRad"]
    - ["Loose", "PflowLoose_VarRad"]
    - ["Loose", "PflowTight_VarRad"]
    - ["Loose", "Tight_VarRad"]
    # - ["LowPt", "PflowLoose_VarRad"]
    # - ["LowPt", "PflowTight_VarRad"]
    # - ["LowPt", "Loose_VarRad"]
    # - ["LowPt", "Tight_VarRad"]
  do_parent_decoration: true
  max_eta: 2.5

Lepton:
  amount: 4
  variables: ["EtaBE2", "Z0SinTheta", "sigd0PV"]
  variables_int: ["isPrompt","truthOrigin", "truthType", "isQMisID"]

# orthogonality studies  
orthogonality:
  include: EasyjetHub/orth-config.yaml 
  do_orth_check: false # if set to true, this will just add more information to your output ntuple on whether events fall into HH-like categories - it will not remove events (assuming overlap removal including all objects does not have an impact on your analysis)

# list of triggers per year to consider
trigger:
  include: multileptonAnalysis/trigger.yaml

# apply trigger lists to filter events
do_trigger_filtering: true

# write objects with overlap removal applied
# turning this on you have to decide on one large R jet collection
do_overlap_removal: true

#Enable cutflow 
save_hhml_cutflow: true

CutList :
  - PASS_TRIGGER
  - pass_2lss
  - pass_3l
  - pass_bb4l
  - pass_1l2tauhad
  - pass_2l2tauhad
  # - pass_2lss1tauhad
  # - pass_1l3tauhad

# Include the TTree configuration and update details
ttree_output:
  - AnalysisMiniTree:
    include: EasyjetHub/AnalysisMiniTree-config.yaml
    # Our overrides. All defaults are off
    slim_variables_with_syst: true
    reco_outputs:
      small_R_jets: 'container_names.output.reco4PFlowJet'
      muons: 'container_names.output.muons'
      electrons: 'container_names.output.electrons'
      taus: 'container_names.output.taus'
      met : 'container_names.output.met'
    collection_options:
      small_R_jets:
        btag_info: true
        truth_parent_info: true
        run_selection: true
      taus:
        truth_branches: True
        truth_parent_info: true
        run_selection: true
      electrons:
        run_selection: true
        truth_parent_info: true
      muons:
        run_selection: true
        truth_parent_info: true
    truth_outputs:
      small_R_jets: 'container_names.input.truth4Jet'
      higgs_particle: 'container_names.output.truthHHParticles'
