include: [EasyjetHub/base-config.yaml]

# Which analysis and channels to consider
do_bbVV_analysis: false
do_VBF_analysis : true
channel: []

# Decay mode considered for truth decoration
Truth:
  decayModes: ["bbWW","bbZZ"]

# Toggles for object types
do_small_R_jets: true
do_large_R_UFO_jets: true
do_muons: true
do_electrons: true
do_taus: true
do_met : true


# Toggles for reconstructed objects decorations
Small_R_jet:
  max_eta: 4.5
  # btagging nominal working point
  btag_wp: "GN2v01_FixedCutBEff_90"

  btag_extra_wps:
    - GN2v01_Continuous
    - GN2v01_FixedCutBEff_85
    - GN2v01_FixedCutBEff_77
    - GN2v01_FixedCutBEff_70
    - GN2v01_FixedCutBEff_65


Large_R_jet:
  GN2X_hbb_wps: ["FlatMassQCDEff_1p55", "FlatMassQCDEff_1p25", "FlatMassQCDEff_0p94", "FlatMassQCDEff_0p74", "FlatMassQCDEff_0p58", "FlatMassQCDEff_0p46", "FlatMassQCDEff_0p37", "FlatMassQCDEff_0p3", "FlatMassQCDEff_0p25"]
  wtag_type: "ANN" # ANN, DNN
  wtag_wp: "70"
  wtag_extra_wps: ["50","60","80","90"]
  max_eta: 2.0
  

Electron:
  do_IFF_decoration: true
  ID: "LooseBLayerLH"
  Iso: "TightTrackOnly_VarRad"
  extra_wps:
    - ["MediumLH","TightTrackOnly_VarRad"]
    - ["TightLH", "TightTrackOnly_VarRad"]


Muon:
  do_IFF_decoration: true
  ID: "Loose"
  Iso: "PflowLoose_VarRad"
  extra_wps:
    - ["Medium","PflowLoose_VarRad"]
    - ["Tight", "PflowLoose_VarRad"]


Tau:
  ID: "RNNLoose"
  variables: ["pt","eta","phi","E","effSF"]
  variables_int: ["charge","nprong","decayMode"]


# orthogonality studies  
orthogonality:
  include: [EasyjetHub/orth-config.yaml ]
  do_orth_check: false # if set to true, this will just add more information to your output ntuple on whether events fall into HH-like categories - it will not remove events (assuming overlap removal including all objects does not have an impact on your analysis)

# list of triggers per year to consider
Trigger:
  include: [bbVVAnalysis/VBF_trigger.yaml]
  writeOutput: false

# write objects with overlap removal applied
# turning this on you have to decide on one large R jet collection
do_overlap_removal: true
OverlapRemoval:
  do_large_R_jets: false
  do_small_R_jet_large_R_jet: false
  do_boostedLeptons: true

CutList : # Only include general cuts
      - AT_LEAST_TWO_LRJETS
      - EXACTLY_ONE_LEPTON
      - PASS_TRIGGER
      - NO_TAU
      - SIGNAL_LEPTON

# Enable cutflow
save_bbVV_cutflow: true

# Include the TTree configuration and update details
ttree_output:
  include: [EasyjetHub/AnalysisMiniTree-config.yaml]
  slim_variables_with_syst: true
  reco_outputs:
    small_R_jets: 'container_names.output.reco4PFlowJet'
    large_R_UFO_jets: 'container_names.output.reco10UFOJet'
    muons: 'container_names.output.muons'
    electrons: 'container_names.output.electrons'
    taus: 'container_names.output.taus'
    met : 'container_names.output.met'
  collection_options:
    small_R_jets:
      btag_info: true
    large_R_jets:
      truth_labels: true
      truth_parent_info: true
  truth_outputs:
    small_R_jets: 'container_names.input.truth4Jet'
    higgs_particle: 'container_names.output.truthHHParticles'

