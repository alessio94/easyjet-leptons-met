      - PASS_RELPT
      - DIPHOTON_MASS
      - EXACTLY_ZERO_LEPTONS
      - AT_LEAST_TWO_JETS
      - LESS_THAN_SIX_CENTRAL_JETS
      #- AT_LEAST_ONE_B_JET
      #- AT_LEAST_TWO_B_JETS
      - EXACTLY_ONE_B_JET
      #- EXACTLY_TWO_B_JETS

do_CP_systematics: true
systematics_regex: ['JET_JER_EffectiveNP_*', 'EG_*'] # for now include only these systematics

ttree_output:
  include: bbyy-base-output.yaml
