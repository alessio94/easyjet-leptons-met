include: bbyyAnalysis/RunConfig-bbyy-base.yaml

# flag that toggles run-through mode in the SelectorAlg
bypass: false

# name that will go in the tree bbyy_pass_<selection_name>_%SYS%
selection_name: "legacy"

CutList :
      - PASS_TRIGGER
      - TWO_LOOSE_PHOTONS
      - PASS_TRIGGER_MATCHING
      - TWO_TIGHTID_PHOTONS
      - TWO_ISO_PHOTONS
      - TWO_TIGHTID_ISO_PHOTONS
      - PASS_RELPT
      - DIPHOTON_MASS
      - EXACTLY_ZERO_LEPTONS
      - AT_LEAST_TWO_JETS
      - LESS_THAN_SIX_CENTRAL_JETS
      - EXACTLY_TWO_B_JETS

Electron:
  forceFullSimConfig: true

Photon:
  forceFullSimConfig: true

ttree_output:
  - AnalysisMiniTree:
    include: bbyy-base-output.yaml